name: Enhancement
description: An improvement to something that works - a screen should let you do or show more than it does. ditoAi can plan and build small ones.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For something that is broken, use **Bug** instead. Describe the problem you want solved; you do not need to know the solution. If you are not sure, ditoAi first replies with options grounded in what the product already does - you pick one, and only then does it make a plan to approve.
  - type: input
    id: where
    attributes:
      label: Where should it go?
      description: The page, dialog or flow - e.g. "Contracts > a contract's page" or "Settings > Notifications".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or goal?
      description: What you cannot do today, or what gets in the way - not the solution. Paste or drag in a screenshot of where it happens.
      placeholder: When a vendor misses a visit, I cannot get to the ticket to act on it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you do with it?
      description: The task it helps with. It decides what is worth showing - e.g. "open the ticket and reassign it".
    validations:
      required: true
  - type: dropdown
    id: certainty
    attributes:
      label: How sure are you about the solution?
      description: Unless you know what you want, ditoAi replies with options first.
      options:
        - I know what I want
        - I have an idea, open to options
        - I only know the problem
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Ideas you have
      description: Optional. Read as ideas, not instructions - e.g. "a link per cycle? or let the operator complete the visit?".
    validations:
      required: false
  - type: textarea
    id: unsure
    attributes:
      label: What are you unsure about?
      description: Optional - questions you want answered before anything is built.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: How will you know it is done?
      description: Fill this in if you know what you want. Otherwise ditoAi proposes it with the options.
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Screen
      options:
        - Desktop and phone
        - Desktop
        - Phone
        - Tablet
    validations:
      required: true
  - type: textarea
    id: not
    attributes:
      label: Anything it should not do or change?
      description: Optional - limits, or what must stay as it is.
    validations:
      required: false
